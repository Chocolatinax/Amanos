name: Keep-alive API
# Render free apaga la API tras 15 min sin tráfico y Supabase free pausa la DB tras días sin uso.
# Este ping cada 10 min evita el arranque en frío que deja la app en "Cargando…".
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 120 https://amanos-nm4w.onrender.com/health
